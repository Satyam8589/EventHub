<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Frontend Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .result {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }

        .error {
            background: #ffe6e6;
            border: 1px solid #ff9999;
        }

        .success {
            background: #e6ffe6;
            border: 1px solid #99ff99;
        }

        button {
            margin: 5px;
            padding: 8px;
            border-radius: 3px;
            border: 1px solid #ccc;
            background: #007cba;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #005a8b;
        }

        pre {
            background: #f8f8f8;
            padding: 10px;
            overflow-x: auto;
            border-radius: 3px;
        }

        .event-card {
            border: 1px solid #ddd;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Events Frontend Debug Tool</h1>

    <div class="section">
        <h2>1. Test API Response</h2>
        <button onclick="testAPIResponse()">Test /api/events</button>
        <div id="apiResults" class="result"></div>
    </div>

    <div class="section">
        <h2>2. Simulate Frontend Filtering</h2>
        <button onclick="testFrontendFiltering()">Test Frontend Logic</button>
        <div id="filterResults" class="result"></div>
    </div>

    <div class="section">
        <h2>3. Render Events (Like Frontend)</h2>
        <button onclick="renderEvents()">Render Events</button>
        <div id="eventsContainer" class="result"></div>
    </div>

    <script>
        let eventsData = null;

        async function testAPIResponse() {
            const resultsDiv = document.getElementById('apiResults');

            try {
                resultsDiv.innerHTML = '<div>Fetching events from API...</div>';

                const response = await fetch('/api/events');
                const data = await response.json();

                eventsData = data.events;

                if (!response.ok) {
                    resultsDiv.innerHTML = `<div class="error">API Error: ${response.status}</div>`;
                    return;
                }

                const html = `
                    <div class="success">
                        <h3>API Response Success!</h3>
                        <p><strong>Total Events:</strong> ${data.events?.length || 0}</p>
                        <p><strong>Response Status:</strong> ${response.status}</p>
                    </div>
                    <h4>Events Summary:</h4>
                    <table style="width: 100%; border-collapse: collapse;">
                        <tr style="background: #f0f0f0;">
                            <th style="border: 1px solid #ccc; padding: 5px;">Title</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Category</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Date</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Status</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Price</th>
                        </tr>
                        ${data.events?.map(event => `
                            <tr>
                                <td style="border: 1px solid #ccc; padding: 5px;">${event.title}</td>
                                <td style="border: 1px solid #ccc; padding: 5px;">${event.category}</td>
                                <td style="border: 1px solid #ccc; padding: 5px;">${new Date(event.date).toLocaleDateString()}</td>
                                <td style="border: 1px solid #ccc; padding: 5px;">${event.status}</td>
                                <td style="border: 1px solid #ccc; padding: 5px;">₹${event.price}</td>
                            </tr>
                        `).join('') || '<tr><td colspan="5" style="text-align: center; padding: 10px;">No events</td></tr>'}
                    </table>
                    <h4>Raw Response:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function testFrontendFiltering() {
            const resultsDiv = document.getElementById('filterResults');

            if (!eventsData) {
                resultsDiv.innerHTML = '<div class="error">Please test API response first</div>';
                return;
            }

            // Simulate frontend filtering logic
            const searchTerm = "";
            const selectedCategory = "All Categories";
            const selectedDate = "";

            let filteredEvents = eventsData.filter((event) => {
                const matchesSearch = !searchTerm ||
                    event.title?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    event.description?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    event.location?.toLowerCase().includes(searchTerm.toLowerCase());

                const matchesCategory = selectedCategory === "All Categories" ||
                    event.category === selectedCategory;

                const matchesDate = !selectedDate ||
                    new Date(event.date).toISOString().split("T")[0] === selectedDate;

                return matchesSearch && matchesCategory && matchesDate;
            });

            const html = `
                <div class="success">
                    <h3>Frontend Filtering Results:</h3>
                    <p><strong>Original Events:</strong> ${eventsData.length}</p>
                    <p><strong>After Filtering:</strong> ${filteredEvents.length}</p>
                    <p><strong>Search Term:</strong> "${searchTerm}" (empty)</p>
                    <p><strong>Selected Category:</strong> "${selectedCategory}"</p>
                    <p><strong>Selected Date:</strong> "${selectedDate}" (empty)</p>
                </div>
                <h4>Filtered Events:</h4>
                ${filteredEvents.map(event => `
                    <div style="border: 1px solid #ddd; margin: 5px 0; padding: 10px;">
                        <strong>${event.title}</strong> - ${event.category} - ${new Date(event.date).toLocaleDateString()}
                    </div>
                `).join('') || '<p>No events after filtering</p>'}
            `;
            resultsDiv.innerHTML = html;
        }

        function renderEvents() {
            const resultsDiv = document.getElementById('eventsContainer');

            if (!eventsData) {
                resultsDiv.innerHTML = '<div class="error">Please test API response first</div>';
                return;
            }

            if (eventsData.length === 0) {
                resultsDiv.innerHTML = '<div class="error">No events to render</div>';
                return;
            }

            const eventsHtml = eventsData.map(event => `
                <div class="event-card">
                    <h3>${event.title}</h3>
                    <p><strong>Category:</strong> ${event.category}</p>
                    <p><strong>Date:</strong> ${new Date(event.date).toLocaleDateString()}</p>
                    <p><strong>Location:</strong> ${event.location}</p>
                    <p><strong>Price:</strong> ₹${event.price}</p>
                    <p><strong>Status:</strong> ${event.status}</p>
                    <p>${event.description}</p>
                </div>
            `).join('');

            resultsDiv.innerHTML = `
                <div class="success">
                    <h3>Rendered Events (${eventsData.length}):</h3>
                </div>
                ${eventsHtml}
            `;
        }
    </script>
</body>

</html>
