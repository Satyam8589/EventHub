<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push Notification Test Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.5rem;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    .log {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      margin-top: 15px;
    }

    .log-entry {
      padding: 8px;
      border-bottom: 1px solid #e9ecef;
      margin-bottom: 5px;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-success {
      color: #28a745;
    }

    .log-error {
      color: #dc3545;
    }

    .log-info {
      color: #17a2b8;
    }

    .log-warning {
      color: #ffc107;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 10px;
    }

    .status-success {
      background: #d4edda;
      color: #155724;
    }

    .status-error {
      background: #f8d7da;
      color: #721c24;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #495057;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 1rem;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔔 Push Notification Test Dashboard</h1>

    <!-- Status Card -->
    <div class="card">
      <h2>📊 System Status</h2>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="subscriptionStatus">❓</div>
          <div class="stat-label">Subscription</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="permissionStatus">❓</div>
          <div class="stat-label">Permission</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="swStatus">❓</div>
          <div class="stat-label">Service Worker</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="testsSent">0</div>
          <div class="stat-label">Tests Sent</div>
        </div>
      </div>
    </div>

    <!-- Quick Tests Card -->
    <div class="card">
      <h2>🚀 Quick Tests</h2>
      <div class="button-group">
        <button onclick="testBasicNotification()">📨 Send Test Notification</button>
        <button onclick="testAllEventTypes()">🎯 Test All Event Types</button>
        <button onclick="checkSubscriptionStatus()">🔍 Check Subscription</button>
        <button onclick="checkDatabase()">💾 Check Database</button>
      </div>
    </div>

    <!-- Event Type Tests Card -->
    <div class="card">
      <h2>🎭 Test Specific Event Types</h2>
      <div class="button-group">
        <button onclick="sendEventNotification('new-event')">🎉 New Event</button>
        <button onclick="sendEventNotification('low-tickets')">⚠️ Low Tickets</button>
        <button onclick="sendEventNotification('event-ongoing')">🔴 Event Live</button>
        <button onclick="sendEventNotification('event-updated')">📝 Event Updated</button>
        <button onclick="sendEventNotification('booking-confirmed')">✅ Booking Confirmed</button>
        <button onclick="sendEventNotification('payment-success')">💳 Payment Success</button>
        <button onclick="sendEventNotification('payment-pending')">⏳ Payment Pending</button>
        <button onclick="sendEventNotification('payment-failed')">❌ Payment Failed</button>
      </div>
    </div>

    <!-- Custom Notification Card -->
    <div class="card">
      <h2>✏️ Send Custom Notification</h2>
      <div class="input-group">
        <label for="customTitle">Title:</label>
        <input type="text" id="customTitle" placeholder="Enter notification title" value="🧪 Custom Test">
      </div>
      <div class="input-group">
        <label for="customMessage">Message:</label>
        <textarea id="customMessage" placeholder="Enter notification message">This is a custom test notification!</textarea>
      </div>
      <button onclick="sendCustomNotification()">📤 Send Custom Notification</button>
    </div>

    <!-- Log Card -->
    <div class="card">
      <h2>📝 Test Log</h2>
      <button onclick="clearLog()" style="float: right; padding: 8px 15px; font-size: 0.9rem;">🗑️ Clear Log</button>
      <div class="log" id="logContainer">
        <div class="log-entry log-info">Ready to test push notifications...</div>
      </div>
    </div>
  </div>

  <script>
    let testsSent = 0;

    // Initialize
    window.addEventListener('load', () => {
      updateStatus();
      log('Dashboard loaded successfully', 'success');
    });

    // Update status indicators
    async function updateStatus() {
      // Check permission
      const permission = Notification.permission;
      document.getElementById('permissionStatus').textContent = 
        permission === 'granted' ? '✅' : permission === 'denied' ? '❌' : '⚠️';

      // Check service worker
      if ('serviceWorker' in navigator) {
        const registration = await navigator.serviceWorker.getRegistration();
        document.getElementById('swStatus').textContent = registration ? '✅' : '❌';
        
        // Check subscription
        if (registration) {
          const subscription = await registration.pushManager.getSubscription();
          document.getElementById('subscriptionStatus').textContent = subscription ? '✅' : '❌';
        }
      }
    }

    // Log function
    function log(message, type = 'info') {
      const logContainer = document.getElementById('logContainer');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function clearLog() {
      document.getElementById('logContainer').innerHTML = 
        '<div class="log-entry log-info">Log cleared</div>';
    }

    // Test basic notification
    async function testBasicNotification() {
      try {
        log('Sending basic test notification...', 'info');
        
        const response = await fetch('/api/push/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: '🧪 Test Notification',
            message: 'This is a basic test notification from the dashboard!',
            icon: '/icon-192.png',
            data: { url: '/' }
          })
        });

        const result = await response.json();
        
        if (result.success) {
          testsSent++;
          document.getElementById('testsSent').textContent = testsSent;
          log(`✅ Notification sent successfully! (${result.successful}/${result.total})`, 'success');
        } else {
          log(`❌ Failed to send notification: ${result.error}`, 'error');
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }

    // Test all event types
    async function testAllEventTypes() {
      const eventTypes = [
        { type: 'new-event', title: '🎉 New Event Available!', message: 'Tech Conference 2024 has been posted!' },
        { type: 'low-tickets', title: '⚠️ Limited Tickets!', message: 'Only 5 tickets left for Summer Festival!' },
        { type: 'event-ongoing', title: '🔴 Event Now Live!', message: 'Music Concert is now ongoing!' },
        { type: 'event-updated', title: '📝 Event Updated', message: 'Workshop details have been updated.' },
        { type: 'booking-confirmed', title: '✅ Booking Confirmed!', message: 'Your booking for Tech Meetup is confirmed.' },
        { type: 'payment-success', title: '💳 Payment Successful!', message: 'Payment for Art Exhibition successful!' },
        { type: 'payment-pending', title: '⏳ Payment Pending', message: 'Your payment is being processed.' },
        { type: 'payment-failed', title: '❌ Payment Failed', message: 'Payment for Sports Event failed.' }
      ];

      log(`Testing all ${eventTypes.length} event types...`, 'info');

      for (let i = 0; i < eventTypes.length; i++) {
        setTimeout(async () => {
          const event = eventTypes[i];
          try {
            const response = await fetch('/api/push/send', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: event.title,
                message: event.message,
                icon: '/icon-192.png',
                tag: event.type
              })
            });

            const result = await response.json();
            if (result.success) {
              testsSent++;
              document.getElementById('testsSent').textContent = testsSent;
              log(`✅ Sent: ${event.type}`, 'success');
            }
          } catch (error) {
            log(`❌ Failed: ${event.type} - ${error.message}`, 'error');
          }
        }, i * 2000); // 2 second delay between each
      }
    }

    // Send specific event notification
    async function sendEventNotification(eventType) {
      const eventData = {
        'new-event': { title: '🎉 New Event Available!', message: 'Tech Conference 2024 has been posted!' },
        'low-tickets': { title: '⚠️ Limited Tickets!', message: 'Only 5 tickets left!' },
        'event-ongoing': { title: '🔴 Event Now Live!', message: 'The event is now ongoing!' },
        'event-updated': { title: '📝 Event Updated', message: 'Event details have been updated.' },
        'booking-confirmed': { title: '✅ Booking Confirmed!', message: 'Your booking is confirmed.' },
        'payment-success': { title: '💳 Payment Successful!', message: 'Payment successful!' },
        'payment-pending': { title: '⏳ Payment Pending', message: 'Payment is being processed.' },
        'payment-failed': { title: '❌ Payment Failed', message: 'Payment failed. Please try again.' }
      };

      const data = eventData[eventType];
      
      try {
        log(`Sending ${eventType} notification...`, 'info');
        
        const response = await fetch('/api/push/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: data.title,
            message: data.message,
            icon: '/icon-192.png',
            tag: eventType
          })
        });

        const result = await response.json();
        
        if (result.success) {
          testsSent++;
          document.getElementById('testsSent').textContent = testsSent;
          log(`✅ ${eventType} notification sent!`, 'success');
        } else {
          log(`❌ Failed: ${result.error}`, 'error');
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }

    // Send custom notification
    async function sendCustomNotification() {
      const title = document.getElementById('customTitle').value;
      const message = document.getElementById('customMessage').value;

      if (!title || !message) {
        log('⚠️ Please enter both title and message', 'warning');
        return;
      }

      try {
        log('Sending custom notification...', 'info');
        
        const response = await fetch('/api/push/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            message,
            icon: '/icon-192.png'
          })
        });

        const result = await response.json();
        
        if (result.success) {
          testsSent++;
          document.getElementById('testsSent').textContent = testsSent;
          log(`✅ Custom notification sent!`, 'success');
        } else {
          log(`❌ Failed: ${result.error}`, 'error');
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }

    // Check subscription status
    async function checkSubscriptionStatus() {
      try {
        log('Checking subscription status...', 'info');
        
        if (!('serviceWorker' in navigator)) {
          log('❌ Service Worker not supported', 'error');
          return;
        }

        const registration = await navigator.serviceWorker.getRegistration();
        if (!registration) {
          log('⚠️ No service worker registered', 'warning');
          return;
        }

        const subscription = await registration.pushManager.getSubscription();
        if (subscription) {
          log('✅ Active subscription found', 'success');
          log(`Endpoint: ${subscription.endpoint.substring(0, 50)}...`, 'info');
        } else {
          log('⚠️ No active subscription', 'warning');
        }

        await updateStatus();
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }

    // Check database (requires API endpoint)
    async function checkDatabase() {
      log('⚠️ Database check requires SQL access', 'warning');
      log('Run this query in your database:', 'info');
      log('SELECT COUNT(*) FROM push_subscriptions;', 'info');
    }
  </script>
</body>
</html>
