<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Price Debugging Tool</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        input, button { margin: 5px; padding: 8px; border-radius: 3px; border: 1px solid #ccc; }
        button { background: #007cba; color: white; cursor: pointer; }
        button:hover { background: #005a8b; }
        pre { background: #f8f8f8; padding: 10px; overflow-x: auto; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Event Price Debugging Tool</h1>
    
    <div class="section">
        <h2>0. Database Health Check</h2>
        <button onclick="checkDatabaseHealth()">Check Database Health</button>
        <div id="dbHealthResults" class="result"></div>
    </div>

    <div class="section">
        <h2>1. List All Events with Prices</h2>
        <button onclick="listAllEvents()">List All Events</button>
        <div id="eventsListResults" class="result"></div>
    </div>

    <div class="section">
        <h2>1.5. Test Event Management</h2>
        <button onclick="createTestEvent()">Create Test Event</button>
        <button onclick="cleanupTestEvents()" style="background: #d32f2f;">Clean Up Test Events</button>
        <div id="testEventResults" class="result"></div>
    </div>

    <div class="section">
        <h2>2. Check Specific Event Price Data</h2>
        <input type="text" id="eventId" placeholder="Enter Event ID" />
        <button onclick="debugEventPrice()">Debug Event Price</button>
        <div id="eventPriceResults" class="result"></div>
    </div>

    <div class="section">
        <h2>3. Test Form Price Submission</h2>
        <input type="number" id="testPrice" step="0.01" placeholder="Enter test price" value="50.00" />
        <button onclick="testPriceSubmission()">Test Price Handling</button>
        <div id="priceTestResults" class="result"></div>
    </div>

    <div class="section">
        <h2>3. API Response Analysis</h2>
        <div id="apiAnalysisResults" class="result">
            <p>Use the buttons above to run tests and see detailed analysis here.</p>
        </div>
    </div>

    <script>
        async function checkDatabaseHealth() {
            const resultsDiv = document.getElementById('dbHealthResults');
            
            try {
                resultsDiv.innerHTML = '<div>Checking database health...</div>';
                
                const response = await fetch('/api/debug/db-health');
                const data = await response.json();
                
                if (!response.ok) {
                    resultsDiv.innerHTML = `<div class="error">Health Check Failed: ${data.error}</div>`;
                    return;
                }
                
                const statusClass = data.status === 'healthy' ? 'success' : 'error';
                let html = `
                    <div class="${statusClass}">
                        <h3>Database Health Status: ${data.status.toUpperCase()}</h3>
                        <p><strong>Timestamp:</strong> ${data.timestamp}</p>
                    </div>
                    <h3>Connection Details:</h3>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Database Connection</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.database_connection ? '✅ Connected' : '❌ Failed'}</td></tr>
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Events Table</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.events_table_accessible ? '✅ Accessible' : '❌ Not Accessible'}</td></tr>
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Events Count</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.events_count}</td></tr>
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Users Table</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.users_table_accessible ? '✅ Accessible' : '❌ Not Accessible'}</td></tr>
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Users Count</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.users_count}</td></tr>
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Bookings Table</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.bookings_table_accessible ? '✅ Accessible' : '❌ Not Accessible'}</td></tr>
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Bookings Count</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.bookings_count}</td></tr>
                    </table>
                    
                    <h3>Configuration:</h3>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Supabase URL</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.supabase_config.url_exists ? '✅ Set (' + data.details.supabase_config.url_preview + ')' : '❌ Missing'}</td></tr>
                        <tr><td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">Supabase Anon Key</td><td style="border: 1px solid #ccc; padding: 5px;">${data.details.supabase_config.anon_key_exists ? '✅ Set' : '❌ Missing'}</td></tr>
                    </table>
                `;
                
                if (data.details.errors.connection_error) {
                    html += `<div class="error"><strong>Connection Error:</strong> ${data.details.errors.connection_error}</div>`;
                }
                
                if (data.details.sample_events && data.details.sample_events.length > 0) {
                    html += `<h3>Sample Events:</h3><pre>${JSON.stringify(data.details.sample_events, null, 2)}</pre>`;
                }
                
                resultsDiv.innerHTML = html;
                updateApiAnalysis('Database Health Check', data);
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function createTestEvent() {
            const resultsDiv = document.getElementById('testEventResults');
            
            try {
                resultsDiv.innerHTML = '<div>Creating test event...</div>';
                
                const response = await fetch('/api/debug/create-test-event', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (!response.ok) {
                    resultsDiv.innerHTML = `<div class="error">Failed to create test event: ${data.error}</div>`;
                    return;
                }
                
                const html = `
                    <div class="success">
                        <h3>Test Event Created Successfully!</h3>
                        <p><strong>Event ID:</strong> ${data.event.id}</p>
                        <p><strong>Title:</strong> ${data.event.title}</p>
                        <p><strong>Original Price:</strong> ${data.price_verification.original_price}</p>
                        <p><strong>Stored Price:</strong> ${data.price_verification.stored_price}</p>
                        <p><strong>Price Matches:</strong> ${data.price_verification.price_matches ? '✅ Yes' : '❌ No'}</p>
                        <p><strong>Price Type:</strong> ${data.price_verification.price_type}</p>
                    </div>
                    <pre>${JSON.stringify(data.event, null, 2)}</pre>
                `;
                resultsDiv.innerHTML = html;
                updateApiAnalysis('Test Event Creation', data);
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function cleanupTestEvents() {
            const resultsDiv = document.getElementById('testEventResults');
            
            try {
                resultsDiv.innerHTML = '<div>Cleaning up test events...</div>';
                
                const response = await fetch('/api/debug/create-test-event', {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (!response.ok) {
                    resultsDiv.innerHTML = `<div class="error">Failed to clean up: ${data.error}</div>`;
                    return;
                }
                
                const html = `
                    <div class="success">
                        <h3>Cleanup Complete</h3>
                        <p>${data.message}</p>
                    </div>
                `;
                resultsDiv.innerHTML = html;
                updateApiAnalysis('Test Event Cleanup', data);
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function listAllEvents() {
            const resultsDiv = document.getElementById('eventsListResults');
            
            try {
                resultsDiv.innerHTML = '<div>Loading all events...</div>';
                
                const response = await fetch('/api/debug/events-list');
                const data = await response.json();
                
                if (!response.ok) {
                    resultsDiv.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                    return;
                }
                
                let html = `
                    <div class="success">
                        <h3>Events Summary:</h3>
                        <p><strong>Total Events:</strong> ${data.total_events}</p>
                        <p><strong>Events with 0.99 price:</strong> ${data.price_summary.events_with_0_99}</p>
                        <p><strong>Unique prices:</strong> ${data.price_summary.unique_prices.join(', ')}</p>
                    </div>
                    <h3>Events List:</h3>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                        <tr style="background: #f0f0f0;">
                            <th style="border: 1px solid #ccc; padding: 5px;">ID</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Title</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Price</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Type</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Is 0.99?</th>
                            <th style="border: 1px solid #ccc; padding: 5px;">Date</th>
                        </tr>
                `;
                
                data.events.forEach(event => {
                    const priceStyle = event.price === 0.99 ? 'background: #ffe6e6;' : '';
                    html += `
                        <tr style="${priceStyle}">
                            <td style="border: 1px solid #ccc; padding: 5px; font-family: monospace;">${event.id}</td>
                            <td style="border: 1px solid #ccc; padding: 5px;">${event.title}</td>
                            <td style="border: 1px solid #ccc; padding: 5px; font-weight: bold;">${event.price_analysis.formatted}</td>
                            <td style="border: 1px solid #ccc; padding: 5px;">${event.price_analysis.price_type}</td>
                            <td style="border: 1px solid #ccc; padding: 5px;">${event.price_analysis.is_0_99 ? '✅ YES' : '❌ No'}</td>
                            <td style="border: 1px solid #ccc; padding: 5px;">${new Date(event.date).toLocaleDateString()}</td>
                        </tr>
                    `;
                });
                
                html += '</table>';
                resultsDiv.innerHTML = html;
                
                updateApiAnalysis('Events List', data);
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function debugEventPrice() {
            const eventId = document.getElementById('eventId').value;
            const resultsDiv = document.getElementById('eventPriceResults');
            
            if (!eventId) {
                resultsDiv.innerHTML = '<div class="error">Please enter an Event ID</div>';
                return;
            }

            try {
                resultsDiv.innerHTML = '<div>Loading...</div>';
                
                const response = await fetch(`/api/debug/event-price/${eventId}`);
                const data = await response.json();
                
                if (!response.ok) {
                    resultsDiv.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                    return;
                }
                
                const html = `
                    <div class="success">
                        <h3>Event Price Debug Data:</h3>
                        <p><strong>Event ID:</strong> ${data.event.id}</p>
                        <p><strong>Event Title:</strong> ${data.event.title}</p>
                        <p><strong>Raw Price:</strong> ${data.price_info.raw_price}</p>
                        <p><strong>Price Type:</strong> ${data.price_info.price_type}</p>
                        <p><strong>Price String:</strong> "${data.price_info.price_string}"</p>
                        <p><strong>parseFloat(price):</strong> ${data.price_info.parseFloat_price}</p>
                        <p><strong>parseFloat(price) || 0:</strong> ${data.price_info.parseFloat_or_zero}</p>
                        <p><strong>Is exactly 0.99:</strong> ${data.price_info.is_exact_0_99}</p>
                        <p><strong>Formatted Price:</strong> ${data.price_info.price_formatted}</p>
                        <p><strong>Created:</strong> ${data.event.created_at}</p>
                        <p><strong>Updated:</strong> ${data.event.updated_at}</p>
                    </div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                resultsDiv.innerHTML = html;
                
                // Also update API analysis
                updateApiAnalysis('Event Price Debug', data);
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function testPriceSubmission() {
            const testPrice = document.getElementById('testPrice').value;
            const resultsDiv = document.getElementById('priceTestResults');
            
            // Simulate form data processing
            const formData = { price: testPrice };
            
            // Test various conversion methods
            const tests = [
                { name: 'Original value', value: testPrice, type: typeof testPrice },
                { name: 'parseFloat(price)', value: parseFloat(testPrice), type: typeof parseFloat(testPrice) },
                { name: 'parseFloat(price) || 0', value: parseFloat(testPrice) || 0, type: typeof (parseFloat(testPrice) || 0) },
                { name: 'Number(price)', value: Number(testPrice), type: typeof Number(testPrice) },
                { name: 'Number(price) || 0', value: Number(testPrice) || 0, type: typeof (Number(testPrice) || 0) },
                { name: 'parseInt(price)', value: parseInt(testPrice), type: typeof parseInt(testPrice) },
                { name: 'Math.round(price * 100) / 100', value: Math.round(parseFloat(testPrice) * 100) / 100, type: typeof (Math.round(parseFloat(testPrice) * 100) / 100) }
            ];
            
            let html = '<h3>Price Conversion Test Results:</h3>';
            tests.forEach(test => {
                html += `<p><strong>${test.name}:</strong> ${test.value} (${test.type})</p>`;
            });
            
            // Test JSON serialization
            const eventData = { price: parseFloat(testPrice) };
            html += `<h3>JSON Serialization:</h3>`;
            html += `<pre>${JSON.stringify(eventData, null, 2)}</pre>`;
            
            resultsDiv.innerHTML = html;
            
            updateApiAnalysis('Price Conversion Test', { input: testPrice, tests, eventData });
        }

        function updateApiAnalysis(testName, data) {
            const analysisDiv = document.getElementById('apiAnalysisResults');
            
            const timestamp = new Date().toLocaleTimeString();
            const html = `
                <h3>Latest Test: ${testName} (${timestamp})</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            analysisDiv.innerHTML = html;
        }
    </script>
</body>
</html>
