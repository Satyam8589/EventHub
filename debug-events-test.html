<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Frontend Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .event-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .status {
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
        }

        .upcoming {
            background-color: #4CAF50;
        }

        .running {
            background-color: #FF9800;
        }

        .expired {
            background-color: #f44336;
        }

        .debug {
            background-color: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
        }

        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Events Frontend Test</h1>
    <p>Current time: <span id="currentTime"></span></p>

    <div>
        <button onclick="testEventsAPI()">Test Events API</button>
        <button onclick="testFrontendLogic()">Test Frontend Logic</button>
        <button onclick="visitEventsPage()">Visit Events Page</button>
    </div>

    <div id="results"></div>

    <script>
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString();
        }

        async function testEventsAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing Events API...</p>';

            try {
                const response = await fetch('/api/events');
                const data = await response.json();

                results.innerHTML = `
                    <div class="debug">
                        <h3>Events API Response:</h3>
                        <p>Total events: ${data.events?.length || 0}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                results.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }

        async function testFrontendLogic() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing Frontend Logic...</p>';

            try {
                const response = await fetch('/api/debug/frontend-events');
                const data = await response.json();

                let eventsHtml = '';
                if (data.filteredEvents && data.filteredEvents.length > 0) {
                    data.filteredEvents.forEach(event => {
                        const eventDate = new Date(event.date);
                        const now = new Date();
                        let status = 'upcoming';
                        let statusText = 'UPCOMING';

                        if (event.endDate || event.enddate) {
                            const endDate = new Date(event.endDate || event.enddate);
                            if (endDate < now) {
                                status = 'expired';
                                statusText = 'EXPIRED';
                            } else if (eventDate <= now) {
                                status = 'running';
                                statusText = 'RUNNING';
                            }
                        } else {
                            const eventDateOnly = new Date(eventDate.getFullYear(), eventDate.getMonth(), eventDate.getDate());
                            const nowDateOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                            if (eventDateOnly < nowDateOnly) {
                                status = 'expired';
                                statusText = 'EXPIRED';
                            } else if (eventDateOnly.getTime() === nowDateOnly.getTime()) {
                                status = 'running';
                                statusText = 'TODAY';
                            }
                        }

                        eventsHtml += `
                            <div class="event-card">
                                <h4>${event.title} <span class="status ${status}">${statusText}</span></h4>
                                <p><strong>Category:</strong> ${event.category}</p>
                                <p><strong>Date:</strong> ${eventDate.toLocaleDateString()} ${event.time}</p>
                                <p><strong>Location:</strong> ${event.location}, ${event.venue}</p>
                                <p><strong>Price:</strong> $${event.price}</p>
                                <p><strong>Capacity:</strong> ${event.capacity}</p>
                                ${event.endDate || event.enddate ? `<p><strong>End Date:</strong> ${new Date(event.endDate || event.enddate).toLocaleDateString()}</p>` : ''}
                            </div>
                        `;
                    });
                } else {
                    eventsHtml = '<p>No events to display</p>';
                }

                results.innerHTML = `
                    <div class="debug">
                        <h3>Frontend Logic Test Results:</h3>
                        <p>API returned ${data.totalEventsFromAPI} events</p>
                        <p>After filtering: ${data.filteredEventsCount} events</p>
                    </div>
                    <h3>Events that should display:</h3>
                    ${eventsHtml}
                `;
            } catch (error) {
                results.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }

        function visitEventsPage() {
            window.open('/events', '_blank');
        }

        // Update time every second
        setInterval(updateTime, 1000);
        updateTime();

        // Auto-test on load
        testFrontendLogic();
    </script>
</body>

</html>
