<!DOCTYPE html>
<html>

<head>
    <title>Event Form Price Debugging</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
        }

        .result {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
        }

        input {
            margin: 10px;
            padding: 5px;
        }
    </style>
</head>

<body>
    <h1>Event Form Price Debugging Tool</h1>

    <div class="section">
        <h2>Price Input Testing</h2>
        <input type="number" id="priceInput" step="0.01" placeholder="Enter price" />
        <button onclick="testPriceHandling()">Test Price Handling</button>
        <div id="priceResults" class="result"></div>
    </div>

    <div class="section">
        <h2>Form Data Testing</h2>
        <button onclick="testFormDataCreation()">Test Form Data Creation</button>
        <div id="formResults" class="result"></div>
    </div>

    <script>
        function testPriceHandling() {
            const priceInput = document.getElementById('priceInput');
            const price = priceInput.value;
            const results = document.getElementById('priceResults');

            const tests = [
                { label: 'Original value', value: price },
                { label: 'parseFloat(price)', value: parseFloat(price) },
                { label: 'parseFloat(price) || 0', value: parseFloat(price) || 0 },
                { label: 'parseFloat(price) || 0.99', value: parseFloat(price) || 0.99 },
                { label: 'Number(price)', value: Number(price) },
                { label: 'Number(price) || 0', value: Number(price) || 0 },
                { label: 'Rounded to 2 decimals', value: Math.round(parseFloat(price) * 100) / 100 }
            ];

            let html = '<h3>Price Conversion Tests:</h3>';
            tests.forEach(test => {
                html += `<div><strong>${test.label}:</strong> ${test.value} (type: ${typeof test.value})</div>`;
            });

            results.innerHTML = html;
        }

        function testFormDataCreation() {
            const results = document.getElementById('formResults');

            // Simulate form data creation
            const formData = {
                price: document.getElementById('priceInput').value
            };

            // Test API payload creation
            const eventData = {
                price: parseFloat(formData.price)
            };

            let html = '<h3>Form Data Creation:</h3>';
            html += `<div><strong>Original form.price:</strong> ${formData.price}</div>`;
            html += `<div><strong>parseFloat(form.price):</strong> ${eventData.price}</div>`;
            html += `<div><strong>JSON.stringify(eventData):</strong> ${JSON.stringify(eventData)}</div>`;

            results.innerHTML = html;
        }
    </script>
</body>

</html>
